name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported (setup.py python_requires) and newest
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # catches data files missing from the package, which only fail once
      # installed, e.g. `departure --help` crashing on import
      - name: Check built package installs and runs
        run: |
          python -m build --wheel --outdir dist
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/departure --help
